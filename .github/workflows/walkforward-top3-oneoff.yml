name: Walk-forward top3 research

on:
  push:
    branches:
      - research/top3-walkforward-v1
    paths:
      - src/walkforward_top3_v1.py
      - .github/workflows/walkforward-top3-oneoff.yml

permissions:
  contents: write

concurrency:
  group: walkforward-top3-research
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: research/top3-walkforward-v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh upstream data
        run: python src/sync_upstream.py

      - name: Run leakage-safe top3 walk-forward
        run: python src/walkforward_top3_v1.py

      - name: Persist research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/upstream evaluation/walkforward_top3_* forecasts/top3_next.json
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "research: persist top3 walk-forward results [skip ci]"
            git push origin HEAD:research/top3-walkforward-v1
          fi
