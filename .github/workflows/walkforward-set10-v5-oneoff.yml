name: Walk-forward V5 set10 research

on:
  push:
    branches:
      - research/top3-walkforward-v5-regime-set
    paths:
      - 'src/walkforward_set10_v5.py'
      - 'V5_SPEC.md'
      - '.github/workflows/walkforward-set10-v5-oneoff.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/top3-walkforward-v5-regime-set
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Refresh upstream data
        run: python src/sync_upstream.py
      - name: Syntax check V5
        run: python -m py_compile src/walkforward_set10_v5.py
      - name: Run V5 set10 walk-forward
        run: python src/walkforward_set10_v5.py
      - name: Persist V5 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+TheGiver262@users.noreply.github.com"
          git add data/upstream evaluation/walkforward_set10_v5_* forecasts/set10_v5_next.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "research: persist V5 set10 walk-forward"
            git push origin HEAD:research/top3-walkforward-v5-regime-set
          fi
