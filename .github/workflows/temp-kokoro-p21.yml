name: Temp Kokoro P22

on:
  push:
    branches:
      - temp/kokoro-p21-20260826
    paths:
      - '.github/workflows/temp-kokoro-p21.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'kokoro==0.9.4' 'soundfile>=0.12,<1' 'numpy>=1.26,<3'
      - name: Generate exact af_heart pronunciation
        run: |
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          import soundfile as sf
          from kokoro import KPipeline

          words = ['available', 'central', 'growth', 'public', 'benefit']
          out = Path('output/p22-af-heart')
          out.mkdir(parents=True, exist_ok=True)
          pipeline = KPipeline(lang_code='a')
          sr = 24000

          for i, word in enumerate(words, 1):
              chunks = []
              graphemes = []
              phonemes = []
              for result in pipeline(word + '.', voice='af_heart', speed=1.0):
                  try:
                      gs, ps, audio = result
                  except Exception:
                      gs = getattr(result, 'graphemes', '') or getattr(result, 'gs', '') or ''
                      ps = getattr(result, 'phonemes', '') or getattr(result, 'ps', '') or ''
                      audio = getattr(result, 'audio', None)
                  if audio is None:
                      continue
                  if hasattr(audio, 'detach'):
                      audio = audio.detach().cpu().numpy()
                  chunks.append(np.asarray(audio, dtype=np.float32))
                  if gs:
                      graphemes.append(str(gs))
                  if ps:
                      phonemes.append(str(ps))
              if not chunks:
                  raise RuntimeError('No audio generated for ' + word)
              y = np.concatenate(chunks)
              nz = np.flatnonzero(np.abs(y) >= 0.0025)
              if nz.size:
                  pad = int(sr * 0.035)
                  y = y[max(0, int(nz[0]) - pad):min(len(y), int(nz[-1]) + pad + 1)]
              if len(y) / sr > 1.5:
                  raise RuntimeError(f'{word} too long: {len(y)/sr:.3f}s')
              sf.write(out / f'{i:02d}_{word}_af_heart.wav', y, sr, subtype='PCM_16')
              print(word, len(y)/sr, 'phonemes=', ' '.join(phonemes))
          PY
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: month2-p22-af-heart
          path: output/p22-af-heart/
          if-no-files-found: error
          retention-days: 3
