name: Multi-horizon v3 challenger

on:
  workflow_dispatch:
  push:
    branches: [agent/prototype-v3-multihorizon]
    paths:
      - 'src/xsmb_multihorizon_v3.py'
      - '.github/workflows/multihorizon-v3.yml'

permissions:
  contents: write

concurrency:
  group: xsmb-multihorizon-v3
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: pytest -q
      - name: Run nested multi-horizon challenger
        run: |
          TARGET_DATE=$(TZ=Asia/Bangkok date +%F)
          echo "Target date: $TARGET_DATE"
          python src/xsmb_multihorizon_v3.py --target-date "$TARGET_DATE"
      - name: Commit challenger outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/multihorizon_v3
          if git diff --cached --quiet; then
            echo "No challenger output changes"
          else
            git commit -m "Refresh multi-horizon v3 challenger"
            git push origin HEAD:agent/prototype-v3-multihorizon
          fi
