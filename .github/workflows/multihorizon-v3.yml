name: Multi-horizon v3 challenger

on:
  workflow_dispatch:
  schedule:
    # 15:00 Vietnam time. GitHub scheduled runs can be delayed, so keep a wide
    # safety margin before the XSMB draw while preserving pre-draw semantics.
    - cron: '0 8 * * *'

permissions:
  contents: write

concurrency:
  group: xsmb-repo-write
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: pytest -q
      - name: Refresh upstream data in workspace
        run: python src/sync_upstream.py
      - name: Run nested probability and ranking challengers
        run: |
          TARGET_DATE=$(TZ=Asia/Bangkok date +%F)
          echo "Target date: $TARGET_DATE"
          python src/xsmb_multihorizon_v3.py --target-date "$TARGET_DATE"
          python src/xsmb_rank_challenger.py --target-date "$TARGET_DATE"
          python src/prefix3_history.py --target-date "$TARGET_DATE"
      - name: Freeze immutable pre-draw paper snapshot
        run: |
          TARGET_DATE=$(TZ=Asia/Bangkok date +%F)
          if [[ "$TARGET_DATE" > "2026-08-17" ]]; then
            echo "Temporary paper-trading week has ended; no new snapshot."
            exit 0
          fi
          if grep -q "^${TARGET_DATE}," data/upstream/xsmb.csv; then
            echo "Draw ${TARGET_DATE} already exists upstream; refusing retrospective paper snapshot."
            exit 0
          fi
          mkdir -p paper/challenger/forecasts
          for suffix in probability ranking probability_summary rank_summary prefix3; do
            target="paper/challenger/forecasts/${TARGET_DATE}_${suffix}"
            case "$suffix" in
              probability) src="research/multihorizon_v3/next_prediction.csv"; target="${target}.csv" ;;
              ranking) src="research/rank_challenger/current_ranking.csv"; target="${target}.csv" ;;
              probability_summary) src="research/multihorizon_v3/summary.json"; target="${target}.json" ;;
              rank_summary) src="research/rank_challenger/summary.json"; target="${target}.json" ;;
              prefix3) src="research/prefix3_history/current.csv"; target="${target}.csv" ;;
            esac
            if [ -e "$target" ]; then
              echo "Immutable snapshot already exists: $target"
            else
              cp "$src" "$target"
            fi
          done
      - name: Commit challenger outputs
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/multihorizon_v3 research/rank_challenger research/prefix3_history paper/challenger/forecasts
          git restore data/upstream || true
          if git diff --cached --quiet; then
            echo "No challenger output changes"
          else
            git commit -m "Refresh challenger research and paper forecast"
            git pull --rebase origin "$BRANCH"
            git push origin HEAD:"$BRANCH"
          fi
