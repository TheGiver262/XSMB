name: Walk-forward top3 V2 research

on:
  push:
    branches:
      - research/top3-walkforward-v2-shortterm-station
    paths:
      - 'src/walkforward_top3_v2.py'
      - '.github/workflows/walkforward-top3-v2-oneoff.yml'

permissions:
  contents: write

jobs:
  backtest-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/top3-walkforward-v2-shortterm-station
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Refresh upstream data
        run: python src/sync_upstream.py
      - name: Run V2 walk-forward
        run: python src/walkforward_top3_v2.py
      - name: Persist V2 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/upstream evaluation/walkforward_top3_v2_* forecasts/top3_v2_next.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "research: persist V2 short-term station backtest"
            git push origin HEAD:research/top3-walkforward-v2-shortterm-station
          fi
