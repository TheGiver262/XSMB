name: Daily post-draw settlement

on:
  schedule:
    # 20:30 and fallback 21:30 Vietnam time (UTC+7).
    - cron: '30 13,14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xsmb-daily-write
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: pytest -q
      - name: Evaluate draw, roll data, retrain and preview next draw
        run: python src/daily_pipeline.py settle
      - name: Commit settlement outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/parts data/dataset_summary.json evaluation output
          if git diff --cached --quiet; then
            echo "No settlement changes to commit"
          else
            git commit -m "Settle XSMB $(TZ=Asia/Ho_Chi_Minh date +%F) and update model"
            git pull --rebase origin main
            git push origin main
          fi
