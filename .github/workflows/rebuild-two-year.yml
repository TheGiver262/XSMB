name: Rebuild two-year XSMB dataset

on:
  push:
    branches: [main]
    paths:
      - 'src/extend_history.py'
      - 'src/xsmb_probability.py'
      - 'tests/**'
      - '.github/workflows/rebuild-two-year.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Extend dataset to two years
        run: python src/extend_history.py

      - name: Recalculate next-draw probabilities
        run: |
          python src/xsmb_probability.py \
            --data data/parts \
            --target-date 2026-08-11 \
            --out output/prediction_2026-08-11.csv

      - name: Run tests
        run: pytest -q

      - name: Commit generated data and results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/parts data/dataset_summary.json output/prediction_2026-08-11.csv output/prediction_2026-08-11_metrics.csv
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Extend XSMB history to two years and recalculate model"
            git push
          fi
