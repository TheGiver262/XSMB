name: Walk-forward top3 V4 overlay research

on:
  push:
    branches:
      - research/top3-walkforward-v4-combo-reverse
    paths:
      - 'data/manual/xsmb_2026-08-28.csv'
      - 'src/run_v4_with_manual_overlay.py'
      - '.github/workflows/walkforward-top3-v4-overlay-oneoff.yml'

permissions:
  contents: write

jobs:
  backtest-v4-overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/top3-walkforward-v4-combo-reverse
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run V4 with sourced manual overlay
        run: python src/run_v4_with_manual_overlay.py
      - name: Persist V4 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+TheGiver262@users.noreply.github.com"
          git add evaluation/walkforward_top3_v4_* forecasts/top3_v4_next.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "research: settle 2026-08-28 and forecast next V4"
            git push origin HEAD:research/top3-walkforward-v4-combo-reverse
          fi
