name: One-time Maigret scan (wriffer)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maigret-wriffer-once.yml'

permissions:
  contents: read

jobs:
  maigret:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Maigret
        run: |
          python -m pip install --upgrade pip
          python -m pip install maigret

      - name: Scan username wriffer
        shell: bash
        run: |
          set -o pipefail
          mkdir -p maigret-report
          cd maigret-report
          timeout 20m maigret wriffer --json simple --html 2>&1 | tee maigret-output.txt || true
          echo '--- generated files ---'
          find . -maxdepth 2 -type f -print

      - name: Upload Maigret report
        uses: actions/upload-artifact@v4
        with:
          name: maigret-wriffer-report
          path: maigret-report/
          if-no-files-found: error
          retention-days: 7
