name: Actions history cleanup

on:
  workflow_dispatch:
    inputs:
      retention_days:
        description: "Delete only completed runs older than this many days (minimum 7)"
        required: true
        default: 30
        type: number

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete only old completed workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          RETENTION_DAYS: ${{ inputs.retention_days }}
        run: |
          set -euo pipefail

          if ! [[ "$RETENTION_DAYS" =~ ^[0-9]+$ ]] || (( RETENTION_DAYS < 7 )); then
            echo "retention_days must be an integer >= 7" >&2
            exit 1
          fi

          cutoff_epoch="$(date -u -d "${RETENTION_DAYS} days ago" +%s)"
          mapfile -t runs < <(
            gh api --paginate "repos/${REPO}/actions/runs?per_page=100" \
              --jq '.workflow_runs[] | "\(.id)\t\(.status)\t\(.created_at)"'
          )

          deleted=0
          kept_recent=0
          for entry in "${runs[@]}"; do
            IFS=$'\t' read -r run_id status created_at <<< "$entry"
            if [[ "$run_id" == "$CURRENT_RUN_ID" || "$status" != "completed" ]]; then
              continue
            fi
            created_epoch="$(date -u -d "$created_at" +%s)"
            if (( created_epoch >= cutoff_epoch )); then
              kept_recent=$((kept_recent + 1))
              continue
            fi
            if gh api -X DELETE "repos/${REPO}/actions/runs/${run_id}" >/dev/null 2>&1; then
              deleted=$((deleted + 1))
            fi
          done

          echo "Deleted ${deleted} completed runs older than ${RETENTION_DAYS} days."
          echo "Kept ${kept_recent} recent completed runs for audit/forensics."
