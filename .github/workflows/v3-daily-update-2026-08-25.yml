name: V3 daily update 2026-08-25

on:
  push:
    branches:
      - research/top3-walkforward-v3-adaptive
    paths:
      - '.github/workflows/v3-daily-update-2026-08-25.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/top3-walkforward-v3-adaptive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Refresh canonical upstream
        run: python src/sync_upstream.py
      - name: Run frozen V3
        run: python src/walkforward_top3_v3.py
      - name: Run economic evaluator
        run: python src/evaluate_top3_v3_economic.py
      - name: Build reverse and double diagnostics
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          from collections import Counter
          root=Path('.')
          rows=list(csv.DictReader(open(root/'data/upstream/xsmb-2-digits.csv',encoding='utf-8-sig')))
          fc=json.load(open(root/'forecasts/top3_v3_next.json'))
          nums=fc['top3']
          def vals(row):
              return [f"{int(v):02d}" for k,v in row.items() if k!='date' and v not in ('',None)]
          parsed=[(r['date'][:10], vals(r)) for r in rows]
          latest=parsed[-1][0]
          month=latest[:7]
          out={'data_cutoff':latest,'target_date':fc['target_date'],'top3':nums,'reverse':{}}
          for n in nums:
              if n[0]==n[1]:
                  out['reverse'][n]={'reverse':n,'is_double':True}
                  continue
              rev=n[::-1]
              d={'reverse':rev,'is_double':False}
              for w in (7,14,30):
                  seg=parsed[-w:]
                  d[f'reverse_rate_{w}']=sum(rev in v for _,v in seg)/len(seg)
                  d[f'original_rate_{w}']=sum(n in v for _,v in seg)/len(seg)
                  d[f'pair_cooccurrence_{w}']=sum((rev in v) and (n in v) for _,v in seg)/len(seg)
              mseg=[x for x in parsed if x[0].startswith(month)]
              d['reverse_month_rate']=sum(rev in v for _,v in mseg)/len(mseg)
              d['original_month_rate']=sum(n in v for _,v in mseg)/len(mseg)
              out['reverse'][n]=d
          seg=parsed[-365:]
          doubles=[f'{i}{i}' for i in range(10)]
          normals=[f'{i:02d}' for i in range(100) if i//10 != i%10]
          dbl=sum(n in v for _,v in seg for n in doubles)/(len(seg)*len(doubles))
          norm=sum(n in v for _,v in seg for n in normals)/(len(seg)*len(normals))
          out['double_vs_normal_365']={'double_presence_rate_per_number_day':dbl,'normal_presence_rate_per_number_day':norm,'difference_pp':(dbl-norm)*100}
          Path('evaluation/v3_reverse_double_diagnostic.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Persist outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/upstream evaluation forecasts/top3_v3_next.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "research: settle 2026-08-25 and forecast next V3"
            git push origin HEAD:research/top3-walkforward-v3-adaptive
          fi
