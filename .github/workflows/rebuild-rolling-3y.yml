name: Rebuild rolling three-year snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/rebuild_rolling_3y.py'
      - 'src/xsmb_3digit.py'
      - 'src/xsmb_probability_v2.py'
      - '.github/workflows/rebuild-rolling-3y.yml'

permissions:
  contents: write

concurrency:
  group: xsmb-daily-write
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: pytest -q
      - name: Rebuild rolling three-year data and previews
        run: python src/rebuild_rolling_3y.py
      - name: Commit rolling snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/parts data/dataset_summary.json output/statistics_3y_00_99.csv output/statistics_3y_summary.csv output/next_preview*.csv
          if git diff --cached --quiet; then
            echo "No rolling snapshot changes to commit"
          else
            git commit -m "Rebuild rolling three-year XSMB snapshot"
            git pull --rebase origin main
            git push origin main
          fi
