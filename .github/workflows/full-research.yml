name: Full-history predictive research

on:
  workflow_dispatch:
  schedule:
    # Sunday 22:15 Vietnam time.
    - cron: '15 15 * * 0'
  push:
    branches: [main]
    paths:
      - 'src/sync_upstream.py'
      - 'src/research_predictive.py'
      - 'src/xsmb_probability_v2.py'
      - 'src/xsmb_3digit.py'
      - '.github/workflows/full-research.yml'

permissions:
  contents: read

concurrency:
  group: xsmb-repo-write
  cancel-in-progress: false

jobs:
  research:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Sync latest main before generating outputs
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: pytest -q
      - name: Mirror full upstream history
        run: python src/sync_upstream.py
      - name: Run predictive walk-forward research
        run: python src/research_predictive.py
      - name: Stage research outputs
        run: |
          rm -rf artifact
          mkdir -p artifact/data
          cp -a data/upstream artifact/data/upstream
          cp -a research artifact/research
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-research-output
          path: artifact
          retention-days: 1
          if-no-files-found: error

  commit:
    needs: research
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Sync latest main before commit
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: full-research-output
          path: generated
      - name: Validate and copy research outputs
        run: |
          set -euo pipefail
          test -d generated/data/upstream
          test -d generated/research
          if find generated -type l -print -quit | grep -q .; then
            echo "Refusing artifact containing symlinks" >&2
            exit 1
          fi
          unexpected="$(find generated -mindepth 1 -maxdepth 1 ! -name data ! -name research -print -quit)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected artifact path: $unexpected" >&2
            exit 1
          fi
          cp -a generated/data/upstream/. data/upstream/
          cp -a generated/research/. research/
      - name: Commit research outputs and feature gate
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/upstream research
          if git diff --cached --quiet; then
            echo "No research changes to commit"
          else
            git commit -m "Refresh full-history XSMB predictive research"
            git pull --rebase origin main
            git push origin main
          fi
