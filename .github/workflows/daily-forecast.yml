name: Daily pre-draw forecast

on:
  schedule:
    # 17:30 Vietnam time (UTC+7), before the XSMB draw.
    - cron: '30 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xsmb-repo-write
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main before generating outputs
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: pytest -q
      - name: Create immutable 2-digit forecast using rolling 3 years
        run: python src/daily_pipeline_v2.py forecast
      - name: Create immutable 3-digit forecasts
        run: python src/daily_3digit_pipeline.py forecast
      - name: Commit forecast snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecasts/ forecasts_3d/
          if git diff --cached --quiet; then
            echo "No new forecast to commit"
          else
            git commit -m "Add live XSMB forecasts $(TZ=Asia/Ho_Chi_Minh date +%F)"
            git pull --rebase origin main
            git push origin main
          fi
