name: Daily pre-draw forecast

on:
  schedule:
    # 17:30 Vietnam time (UTC+7), before the ~18:15 XSMB draw.
    - cron: '30 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xsmb-daily-write
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: pytest -q
      - name: Create immutable pre-draw forecast
        run: python src/daily_pipeline.py forecast
      - name: Commit forecast snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecasts/
          if git diff --cached --quiet; then
            echo "No new forecast to commit"
          else
            git commit -m "Add live XSMB forecast $(TZ=Asia/Ho_Chi_Minh date +%F)"
            git pull --rebase origin main
            git push origin main
          fi
