name: Walk-forward top3 V3 research

# rerun 2026-08-15 after canonical draw update
on:
  push:
    branches:
      - research/top3-walkforward-v3-adaptive
    paths:
      - 'src/walkforward_top3_v3.py'
      - 'src/evaluate_v3_economic.py'
      - '.github/workflows/walkforward-top3-v3-oneoff.yml'

permissions:
  contents: write

jobs:
  backtest-v3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/top3-walkforward-v3-adaptive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Refresh upstream data
        run: python src/sync_upstream.py
      - name: Run V3 walk-forward
        run: python src/walkforward_top3_v3.py
      - name: Run strict economic evaluation
        run: python src/evaluate_v3_economic.py
      - name: Persist V3 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/upstream evaluation/walkforward_top3_v3_* forecasts/top3_v3_next.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "research: persist V3 adaptive walk-forward backtest"
            git push origin HEAD:research/top3-walkforward-v3-adaptive
          fi
